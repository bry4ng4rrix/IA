# nginx de l'hôte devant le conteneur Laura (port 8050 = LAURA_PORT).
#
#   1. Faire pointer le domaine (enregistrement A) vers le VPS, puis remplacer
#      laura.labeltechnology.mg ci-dessous si besoin.
#   2. sudo cp ~/laura/nginx-laura.conf /etc/nginx/conf.d/laura.conf   (copié par le déploiement)
#      sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d laura.labeltechnology.mg
#      HTTPS est indispensable : une page https ne peut pas ouvrir un ws:// (contenu mixte).
#
# X-Forwarded-For est écrasé ($remote_addr) et non complété ($proxy_add_x_forwarded_for) :
# quotas.ip_client lit la première adresse, qui ne doit pas venir du client. Les en-têtes
# sont répétés dans chaque location : nginx n'hérite pas des proxy_set_header du bloc
# server dès qu'une location en définit un.

server {
    listen 80;
    server_name laura.labeltechnology.mg;

    client_max_body_size 1m;

    location /ws/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /ws/equipe peut rester ouvert longtemps sans trafic.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nécessaire si on abandonne un jour le WebSocket pour du SSE : sans
        # cela nginx accumule toute la réponse et la livre d'un bloc à la fin.
        # Le streaming marche alors en local et disparaît en production, ce qui
        # est long à diagnostiquer. Sans effet sur les réponses JSON courtes.
        proxy_buffering off;
        proxy_cache off;
    }
}
