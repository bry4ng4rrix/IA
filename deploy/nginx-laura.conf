# Bloc server de Laura — À INSTALLER UNE SEULE FOIS.
#
#   sudo cp ~/laura/nginx-laura.conf   /etc/nginx/sites-available/laura.labeltechnology.mg
#   sudo ln -s /etc/nginx/sites-available/laura.labeltechnology.mg /etc/nginx/sites-enabled/
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp ~/laura/laura-proxy.conf   /etc/nginx/snippets/laura-proxy.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <votre-domaine>
#
# ⚠ NE PLUS RECOPIER CE FICHIER ENSUITE. certbot le réécrit pour y poser le
#   certificat, le « listen 443 ssl » et la redirection depuis le port 80.
#   Le remplacer par cette version ferait retomber le site en http seul :
#   « nginx -t » passerait sans broncher, et le widget échouerait en silence
#   (une page https ne peut pas ouvrir un ws://, le navigateur bloque pour
#   contenu mixte sans rien afficher).
#
#   Pour modifier les règles de proxy après coup, éditer et recopier
#   laura-proxy.conf uniquement : il est inclus ci-dessous et certbot n'y
#   touche jamais.
#
# Changer de domaine (ex. passer de DuckDNS au domaine définitif) :
#   1. sudo nano /etc/nginx/sites-available/laura.labeltechnology.mg   → remplacer server_name
#   2. sudo certbot --nginx -d <nouveau-domaine>
#   3. mettre à jour BASE_URL (LAURA_ENV) et NEXT_PUBLIC_LAURA_URL (site)

# sites-enabled/ et non conf.d/ : nginx charge conf.d/ en premier, et sans
# default_server le premier bloc chargé devient le site par défaut du VPS.
# laura.conf passerait avant les sites existants (ordre alphabétique) et
# capterait toutes les requêtes adressées à l'IP ou à un nom inconnu.
server {
    listen 80;
    listen [::]:80;
    server_name laura.labeltechnology.mg;

    client_max_body_size 1m;

    include /etc/nginx/snippets/laura-proxy.conf;
}
